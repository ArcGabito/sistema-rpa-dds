name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  client:
    name: Client (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/client/package-lock.json

      - name: Install dependencies
        working-directory: core/client
        run: npm ci

      - name: Lint
        working-directory: core/client
        run: npm run lint

      - name: Build
        working-directory: core/client
        run: npm run build

  server:
    name: Server (ASP.NET Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: core/server
        run: dotnet restore

      - name: Build
        working-directory: core/server
        run: dotnet build --configuration Release --no-restore

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          status=0
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit $status

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [client, server]
    # On master the API image is published to GitHub Container Registry
    # (free for a public repo), where Azure Container Apps pulls it from.
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Build server image (and publish it on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ghcr.io/arcgabito/sistema-rpa-dds-api:latest
            ghcr.io/arcgabito/sistema-rpa-dds-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ArcGabito/sistema-rpa-dds
            org.opencontainers.image.description=API ASP.NET Core del Sistema RPA de DDS
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    name: Deploy API (Azure Container Apps)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Signs in to Azure with OpenID Connect (no stored password): the app
    # registration behind AZURE_CLIENT_ID trusts this repository's master
    # branch. Without the three AZURE_* values the job is skipped.
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-data-discovery-solutions
      CONTAINER_APP: ca-sistema-rpa-dds-api
    steps:
      - name: Skip without Azure credentials
        if: env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == ''
        run: echo "::notice::Faltan AZURE_CLIENT_ID, AZURE_TENANT_ID o AZURE_SUBSCRIPTION_ID; no se despliega."

      - name: Sign in to Azure
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Only the image changes: secrets, environment variables and the
      # scale-to-zero settings stay as they are on the container app.
      - name: Roll out this commit's image
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --image "ghcr.io/arcgabito/sistema-rpa-dds-api:${{ github.sha }}" --output none --only-show-errors

      - name: Check the API answers
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        run: |
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          # Cold start: the app scales from zero and the database may be paused.
          for i in $(seq 1 18); do
            if curl -fsS --max-time 60 "https://$fqdn/health" > /dev/null; then
              echo "La API responde en https://$fqdn"
              exit 0
            fi
            sleep 10
          done
          echo "::error::La API no respondió en https://$fqdn/health"
          exit 1
